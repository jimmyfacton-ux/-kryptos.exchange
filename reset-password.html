<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password | KRYPTOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand-primary:#FCD535; --brand-hover:#F0B90B; --brand-dark:#181A20;
  --success:#0ECB81; --danger:#F6465D; --muted:#707A8A; --border:#EAECEF; --fill:#F5F5F5; --page:#FAFAFA;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;border:0 solid;margin:0;padding:0}
html{line-height:1.5;-webkit-text-size-adjust:100%;letter-spacing:-.012em}
body{font-family:var(--font-sans);background:var(--page);color:var(--brand-dark);-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--brand-primary);color:var(--brand-dark)}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input{font-family:inherit;outline:none}
svg{display:block;max-width:100%}

/* page */
.reset-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.reset-card{background:#fff;border-radius:24px;max-width:440px;width:100%;padding:28px;box-shadow:0 25px 50px rgba(0,0,0,.08);border:1px solid #f3f4f6;margin:auto}
.reset-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #f3f4f6}
.reset-title-wrap{display:flex;align-items:center;gap:12px}
.reset-logo{width:40px;height:40px;border-radius:12px;background:var(--brand-primary);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.reset-title{font-size:20px;font-weight:800;color:#030712;line-height:1.2;letter-spacing:-.02em}
@media(min-width:640px){.reset-title{font-size:22px}}
.reset-sub{font-size:12px;color:#6b7280;font-weight:500;margin-top:2px}
.back-link{font-size:12px;font-weight:700;color:#6b7280;transition:color .15s;display:flex;align-items:center;gap:4px;flex-shrink:0}
.back-link:hover{color:#111827}
.back-link svg{width:14px;height:14px}

/* form */
.reset-form{display:flex;flex-direction:column;gap:16px;font-size:12px}
.label{display:block;font-weight:700;color:#374151;margin-bottom:5px;font-size:12px}
.input-wrap{position:relative}
.input-icon{width:15px;height:15px;color:#9ca3af;position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
.input{width:100%;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:11px 34px 11px 34px;font-size:13px;font-weight:600;color:#111827;transition:all .15s}
.input:focus{background:#fff;border-color:var(--brand-primary);box-shadow:0 0 0 3px rgba(252,213,53,.25)}
.input::placeholder{color:#9ca3af;font-weight:400}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#9ca3af;padding:2px}
.eye-btn:hover{color:#4b5563}
.eye-btn svg{width:15px;height:15px}

/* hints */
.pw-hints{display:flex;flex-direction:column;gap:4px;margin-top:4px;font-size:11px;font-weight:500;color:#9ca3af}
.pw-hint{display:flex;align-items:center;gap:6px;transition:color .15s}
.pw-hint svg{width:12px;height:12px;flex-shrink:0}
.pw-hint.ok{color:var(--success)}
.pw-hint.ok svg{stroke:var(--success)}

/* submit */
.submit-btn{width:100%;padding:14px;background:var(--brand-primary);color:var(--brand-dark);font-weight:800;font-size:14px;border-radius:16px;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-top:4px}
.submit-btn:hover{background:var(--brand-hover)}
.submit-btn:active{transform:scale(.99)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}

/* footer */
.form-footer{text-align:center;font-size:12px;color:#6b7280;font-weight:500;padding-top:8px}
.form-link{font-weight:800;color:var(--brand-dark);text-decoration:none}
.form-link:hover{color:#b45309;text-decoration:underline}

/* message */
.msg{margin-top:6px;padding:11px;border-radius:10px;font-size:12px;font-weight:600;display:none;text-align:center;line-height:1.5}
.msg.show{display:block}
.msg.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.msg.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.msg.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

/* spinner */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--brand-dark);border-radius:9999px;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* success state */
.success-icon{width:64px;height:64px;border-radius:9999px;background:#ecfdf5;border:2px solid #a7f3d0;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.success-icon svg{width:32px;height:32px;stroke:var(--success);stroke-width:3}
.success-title{font-size:20px;font-weight:900;color:#030712;text-align:center;margin-bottom:8px}
.success-desc{font-size:13px;color:#6b7280;text-align:center;line-height:1.6;margin-bottom:24px}

/* step indicator */
.steps{display:flex;align-items:center;gap:6px;margin-bottom:20px;font-size:11px;font-weight:700;color:#9ca3af}
.step{flex:1;padding:6px 8px;border-radius:8px;text-align:center;background:#f9fafb;border:1px solid #e5e7eb;transition:all .2s}
.step.active{background:var(--brand-primary);color:var(--brand-dark);border-color:var(--brand-hover)}
.step.done{background:#d1fae5;color:#065f46;border-color:#a7f3d0}
</style>
</head>
<body>

<div class="reset-page">
  <div class="reset-card" id="resetCard">
    <!-- Content injected by JS based on state -->
    <div id="cardContent">
      <div class="reset-header">
        <div class="reset-title-wrap">
          <div class="reset-logo">K</div>
          <div>
            <h1 class="reset-title">Reset Password</h1>
            <p class="reset-sub">Loading...</p>
          </div>
        </div>
        <a href="login.html" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          Back
        </a>
      </div>
      <div style="text-align:center;padding:40px 0;color:#9ca3af;font-size:13px">
        <span class="spinner"></span>Loading...
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pzqwmrqdqtozvwfpdmpm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZeJhMI2y2yWGyQ7Aqx_T6A_vyEuVkxJ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const cardContent = document.getElementById('cardContent');

function showMsg(type, text){
  const el = document.getElementById('msg');
  if(!el) return;
  el.className = 'msg show ' + type;
  el.textContent = text;
}

/* password strength checker */
function pwChecks(pw){
  return {
    length: pw.length >= 8,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    number: /[0-9]/.test(pw)
  };
}

function pwHintsHtml(pw){
  const c = pwChecks(pw);
  return `
    <div class="pw-hints">
      <div class="pw-hint ${c.length?'ok':''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        At least 8 characters
      </div>
      <div class="pw-hint ${c.upper?'ok':''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        One uppercase letter
      </div>
      <div class="pw-hint ${c.lower?'ok':''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        One lowercase letter
      </div>
      <div class="pw-hint ${c.number?'ok':''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        One number
      </div>
    </div>
  `;
}

/* ============ STATE 1: REQUEST RESET LINK ============ */
function renderRequestForm(){
  cardContent.innerHTML = `
    <div class="reset-header">
      <div class="reset-title-wrap">
        <div class="reset-logo">K</div>
        <div>
          <h1 class="reset-title">Forgot Password</h1>
          <p class="reset-sub">Enter your email to receive a reset link</p>
        </div>
      </div>
      <a href="login.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back
      </a>
    </div>
    <form class="reset-form" id="requestForm">
      <div>
        <label class="label">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
          <input type="email" class="input" id="email" placeholder="name@example.com" required autocomplete="email" />
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Send Reset Link</button>
      <div class="msg" id="msg"></div>
      <div class="form-footer">
        Remember your password? <a href="login.html" class="form-link">Log in</a>
      </div>
    </form>
  `;

  document.getElementById('requestForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('submitBtn');

    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      showMsg('error', 'Enter a valid email address.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Sending...';

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });

    btn.disabled = false;
    btn.textContent = 'Send Reset Link';

    if(error){
      showMsg('error', error.message);
      return;
    }

    /* show success state */
    cardContent.innerHTML = `
      <div style="padding:8px 0">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        </div>
        <h2 class="success-title">Check your email</h2>
        <p class="success-desc">
          We sent a password reset link to<br>
          <strong style="color:#111827">${email}</strong><br><br>
          Click the link in the email to set a new password. The link expires in 1 hour.
        </p>
        <a href="login.html" class="submit-btn" style="display:block;text-align:center;text-decoration:none">Back to Login</a>
        <div class="form-footer" style="margin-top:16px">
          Didn't receive it? <a href="#" class="form-link" onclick="renderRequestForm();return false">Try again</a>
        </div>
      </div>
    `;
  });
}

/* ============ STATE 2: SET NEW PASSWORD (from email link) ============ */
function renderNewPasswordForm(){
  cardContent.innerHTML = `
    <div class="reset-header">
      <div class="reset-title-wrap">
        <div class="reset-logo">K</div>
        <div>
          <h1 class="reset-title">Set New Password</h1>
          <p class="reset-sub">Choose a strong password</p>
        </div>
      </div>
    </div>
    <div class="steps">
      <div class="step done">1. Verify</div>
      <div class="step active">2. New Password</div>
    </div>
    <form class="reset-form" id="newPasswordForm">
      <div>
        <label class="label">New Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" class="input" id="newPassword" placeholder="Min 8 chars" required autocomplete="new-password" />
          <button type="button" class="eye-btn" data-target="newPassword">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div id="pwHints">${pwHintsHtml('')}</div>
      </div>
      <div>
        <label class="label">Confirm Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" class="input" id="confirmPassword" placeholder="Repeat password" required autocomplete="new-password" />
          <button type="button" class="eye-btn" data-target="confirmPassword">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Update Password</button>
      <div class="msg" id="msg"></div>
    </form>
  `;

  /* password toggle */
  document.querySelectorAll('.eye-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = document.getElementById(btn.dataset.target);
      if(inp){
        inp.type = inp.type === 'password' ? 'text' : 'password';
        btn.style.color = inp.type === 'text' ? '#111827' : '';
      }
    });
  });

  /* live hint updates */
  const newPw = document.getElementById('newPassword');
  newPw.addEventListener('input', () => {
    document.getElementById('pwHints').innerHTML = pwHintsHtml(newPw.value);
  });

  /* submit */
  document.getElementById('newPasswordForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = document.getElementById('newPassword').value;
    const cpw = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('submitBtn');

    const checks = pwChecks(pw);
    if(!checks.length || !checks.upper || !checks.lower || !checks.number){
      showMsg('error', 'Password must be 8+ chars with upper, lower, and number.');
      return;
    }
    if(pw !== cpw){
      showMsg('error', 'Passwords do not match.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Updating...';

    const { error } = await sb.auth.updateUser({ password: pw });

    btn.disabled = false;
    btn.textContent = 'Update Password';

    if(error){
      showMsg('error', error.message);
      return;
    }

    /* success */
    cardContent.innerHTML = `
      <div style="padding:8px 0">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h2 class="success-title">Password updated</h2>
        <p class="success-desc">
          Your password has been changed successfully.<br>
          You can now log in with your new password.
        </p>
        <a href="login.html" class="submit-btn" style="display:block;text-align:center;text-decoration:none">Log In Now</a>
      </div>
    `;
  });
}

/* ============ STATE 3: ERROR / EXPIRED LINK ============ */
function renderErrorState(message){
  cardContent.innerHTML = `
    <div style="padding:8px 0">
      <div class="success-icon" style="background:#fef2f2;border-color:#fecaca">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F6465D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      </div>
      <h2 class="success-title">Link invalid or expired</h2>
      <p class="success-desc">
        ${message || 'This password reset link has expired or is invalid.'}<br><br>
        Please request a new one.
      </p>
      <button class="submit-btn" onclick="renderRequestForm()">Request New Link</button>
      <div class="form-footer" style="margin-top:16px">
        <a href="login.html" class="form-link">Back to Login</a>
      </div>
    </div>
  `;
}

/* ============ INIT — detect state from URL ============ */
(async () => {
  /* Check if this is a reset link callback (Supabase appends #access_token=...&type=recovery) */
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const isRecovery = hash.includes('type=recovery') || search.includes('type=recovery') || hash.includes('access_token');

  if(isRecovery){
    /* Supabase client will automatically pick up the session from URL hash */
    /* Give it a moment to process */
    await new Promise(r => setTimeout(r, 300));

    const { data: { session } } = await sb.auth.getSession();
    if(session){
      renderNewPasswordForm();
    } else {
      renderErrorState('Unable to verify reset link. It may have expired.');
    }
  } else {
    /* No recovery token — show request form */
    /* But also check if user is already in a recovery flow (session exists from hash) */
    const { data: { session } } = await sb.auth.getSession();
    /* Only treat as recovery if URL had recovery param */
    renderRequestForm();
  }
})();

/* Listen for auth state changes (in case Supabase processes recovery after initial check) */
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY' && session){
    renderNewPasswordForm();
  }
});
</script>
</body>
</html>
