<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallet | KRYPTOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand-primary:#FCD535; --brand-hover:#F0B90B; --brand-dark:#181A20;
  --success:#0ECB81; --success-hover:#0BA86C; --danger:#F6465D;
  --muted:#707A8A; --fill:#F5F5F5; --border:#EAECEF; --page:#FAFAFA;
  --wallet-bg:#F4F4F6;
  --font-sans:"Inter","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;border:0 solid;margin:0;padding:0}
html{line-height:1.5;-webkit-text-size-adjust:100%;letter-spacing:-.012em}
body{font-family:var(--font-sans);background:var(--wallet-bg);color:var(--brand-dark);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--brand-primary);color:var(--brand-dark)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9999px}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select{font-family:inherit;outline:none}
img,svg{display:block;max-width:100%}
select{appearance:none;-webkit-appearance:none;background:transparent;border:none;cursor:pointer}
.container{max-width:1280px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.container{padding:0 24px}}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.flex-col{flex-direction:column}.flex-1{flex:1}.shrink-0{flex-shrink:0}
.text-xs{font-size:12px}.text-sm{font-size:14px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}.font-extrabold{font-weight:800}.font-black{font-weight:900}
.tracking-tight{letter-spacing:-.02em}
.text-muted{color:var(--muted)}
.rounded-lg{border-radius:8px}.rounded-xl{border-radius:12px}.rounded-2xl{border-radius:16px}.rounded-3xl{border-radius:24px}.rounded-full{border-radius:9999px}
.uppercase{text-transform:uppercase}

/* header */
.site-header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.header-inner{height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(min-width:640px){.header-inner{height:64px}}
.brand{display:flex;align-items:center;gap:4px;flex-shrink:0}
.menu-btn{display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;color:var(--brand-dark);font-weight:600;font-size:14px}
.menu-btn:hover{background:var(--fill)}
.menu-btn svg{width:22px;height:22px;stroke-width:2.4}
.logo-text{font-weight:800;font-size:17px;letter-spacing:-.03em;color:var(--brand-dark);display:flex;align-items:baseline;gap:1px}
@media(min-width:640px){.logo-text{font-size:20px}}
.logo-text .accent{color:var(--brand-hover)}
.logo-sub{font-size:9px;font-weight:700;color:var(--muted);margin-left:1px}
@media(min-width:640px){.logo-sub{font-size:10px}}
.nav-links{display:flex;align-items:center;gap:4px;margin-left:16px}
.nav-link{padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);border-radius:12px;transition:all .15s}
.nav-link:hover{color:var(--brand-dark);background:#f4f4f5}
.nav-link.active{background:var(--brand-dark);color:#fff;font-weight:700}
.nav-badge{margin-left:4px;padding:1px 6px;font-size:9px;font-weight:900;background:var(--success);color:#fff;border-radius:9999px}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.balance{display:flex;align-items:center;gap:4px}
.balance-val{font-size:13px;font-weight:700;color:var(--brand-dark);font-family:ui-monospace,monospace}
@media(min-width:640px){.balance-val{font-size:14px}}
.balance-eye{color:var(--muted);padding:2px}
.balance-eye svg{width:14px;height:14px}
.avatar{width:30px;height:30px;border-radius:9999px;background:linear-gradient(135deg,#FF6700,#E04800);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0;box-shadow:0 0 0 2px rgba(249,115,22,.2)}
@media(min-width:640px){.avatar{width:32px;height:32px}}
.notif-btn{position:relative;padding:6px;color:var(--brand-dark);border-radius:8px;flex-shrink:0}
.notif-btn:hover{background:var(--fill)}
.notif-btn svg{width:18px;height:18px;stroke-width:2.2}
.notif-badge{position:absolute;top:0;right:0;min-width:16px;height:16px;padding:0 4px;background:#dc2626;color:#fff;font-size:9px;font-weight:900;border-radius:9999px;display:none;align-items:center;justify-content:center;border:2px solid #fff}

/* main */
main{padding-top:8px;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
@media(min-width:768px){main{padding-bottom:40px}}
.wallet-wrap{max-width:1280px;margin:0 auto;padding:8px 16px 0}
@media(min-width:768px){.wallet-wrap{padding:8px 24px 0}}
.wallet-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-top:6px}
.wallet-title{font-size:22px;font-weight:900;color:#030712;letter-spacing:-.02em}
@media(min-width:640px){.wallet-title{font-size:30px}}
.refresh-btn{padding:7px;color:#6b7280;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:color .15s}
.refresh-btn:hover{color:#111827}
.refresh-btn svg{width:15px;height:15px}
.refresh-btn.spinning svg{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* layout */
.wallet-grid{display:block}
@media(min-width:768px){.wallet-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:32px;align-items:start}}
.wallet-left{grid-column:span 5}
@media(min-width:768px){.wallet-left{position:sticky;top:80px}}
.wallet-right{grid-column:span 7;margin-top:16px}
@media(min-width:768px){.wallet-right{margin-top:0}}

/* tabs */
.tab-row{display:flex;gap:6px;margin-bottom:14px}
.tab-btn{padding:9px 16px;border-radius:14px;font-weight:700;font-size:11px;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
@media(min-width:640px){.tab-btn{padding:10px 20px;border-radius:16px;font-size:12px;gap:8px}}
.tab-btn.active{background:var(--brand-dark);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tab-btn:not(.active){background:#fff;color:var(--muted);border:1px solid var(--border)}
.tab-btn:not(.active):hover{background:var(--fill)}
.tab-btn svg{width:14px;height:14px}

/* balance card */
.balance-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:16px}
@media(min-width:640px){.balance-card{border-radius:24px;padding:24px;margin-bottom:20px}}
.balance-label-row{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
@media(min-width:640px){.balance-label-row{font-size:12px}}
.eye-icon{color:var(--muted);transition:color .15s}
.eye-icon:hover{color:var(--brand-dark)}
.eye-icon svg{width:14px;height:14px}
.balance-big{font-size:28px;font-weight:700;color:var(--brand-dark);letter-spacing:-.02em;margin-bottom:8px}
@media(min-width:640px){.balance-big{font-size:36px}}
.balance-desc{font-size:11px;font-weight:500;color:var(--muted);margin-bottom:16px;line-height:1.4}
@media(min-width:640px){.balance-desc{font-size:12px;margin-bottom:20px}}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.action-grid{gap:12px}}
.deposit-btn{width:100%;padding:12px;background:var(--brand-primary);color:var(--brand-dark);font-weight:700;font-size:13px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.06)}
@media(min-width:640px){.deposit-btn{padding:14px;font-size:14px;border-radius:12px;gap:8px}}
.deposit-btn:hover{background:var(--brand-hover)}
.deposit-btn:active{transform:scale(.99)}
.withdraw-btn{width:100%;padding:12px;background:var(--fill);color:var(--brand-dark);font-weight:700;font-size:13px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
@media(min-width:640px){.withdraw-btn{padding:14px;font-size:14px;border-radius:12px;gap:8px}}
.withdraw-btn:hover{background:#e5e7eb}
.withdraw-btn:active{transform:scale(.99)}
.deposit-btn svg,.withdraw-btn svg{width:14px;height:14px;stroke-width:2.5}

/* asset tabs */
.asset-tab-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.asset-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.asset-tabs::-webkit-scrollbar{display:none}
@media(min-width:640px){.asset-tabs{gap:16px}}
.asset-tab{font-size:11px;font-weight:700;padding:4px 2px;color:var(--muted);transition:color .15s;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
@media(min-width:640px){.asset-tab{font-size:12px}}
.asset-tab.active{color:var(--brand-dark);border-bottom-color:var(--brand-primary)}
.hide-zero-label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
.hide-zero-label input{width:14px;height:14px;accent-color:var(--brand-primary);cursor:pointer}

/* asset cards */
.asset-list{display:flex;flex-direction:column;gap:10px}
.asset-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s;box-shadow:0 1px 2px rgba(0,0,0,.03);gap:12px}
@media(min-width:640px){.asset-card{border-radius:16px;padding:16px}}
.asset-card:hover{border-color:#d1d5db}
.asset-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.asset-left > svg{width:34px;height:34px;flex-shrink:0}
@media(min-width:640px){.asset-left > svg{width:40px;height:40px}}
.asset-left > div{min-width:0}
.asset-name{font-size:13px;font-weight:700;color:var(--brand-dark);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:640px){.asset-name{font-size:14px}}
.asset-price{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.asset-right{text-align:right;flex-shrink:0;min-width:0}
.asset-balance{font-size:12px;font-weight:700;color:var(--brand-dark);font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
@media(min-width:640px){.asset-balance{font-size:14px;max-width:none}}
.asset-usd{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.asset-actions{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:8px}
.asset-deposit{padding:5px 10px;font-size:10px;font-weight:700;background:var(--brand-primary);color:var(--brand-dark);border-radius:6px;transition:background .15s;box-shadow:0 1px 2px rgba(0,0,0,.04);white-space:nowrap}
@media(min-width:640px){.asset-deposit{padding:6px 12px;font-size:11px;border-radius:8px}}
.asset-deposit:hover{background:var(--brand-hover)}
.asset-withdraw{padding:5px 10px;font-size:10px;font-weight:700;background:var(--fill);color:var(--brand-dark);border:1px solid var(--border);border-radius:6px;transition:background .15s;white-space:nowrap}
@media(min-width:640px){.asset-withdraw{padding:6px 12px;font-size:11px;border-radius:8px}}
.asset-withdraw:hover{background:#e5e7eb}

/* empty */
.empty-state{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:32px 16px;text-align:center;color:var(--muted);font-size:12px;font-weight:500;line-height:1.5}
@media(min-width:640px){.empty-state{padding:40px 20px;border-radius:16px;font-size:13px}}
.empty-state svg{width:36px;height:36px;margin:0 auto 10px;opacity:.4}

/* activity */
.activity-list{display:flex;flex-direction:column;gap:8px}
.activity-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(min-width:640px){.activity-item{border-radius:14px;padding:14px}}
.activity-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.activity-icon{width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.activity-icon.in{background:#d1fae5;color:#065f46}
.activity-icon.out{background:#fee2e2;color:#991b1b}
.activity-icon svg{width:14px;height:14px}
.activity-title{font-size:12px;font-weight:700;color:#111827;line-height:1.3}
.activity-meta{font-size:10px;color:var(--muted);margin-top:2px}
.activity-amount{text-align:right;flex-shrink:0}
.activity-amount .amt{font-size:12px;font-weight:800;font-family:ui-monospace,monospace}
.activity-amount .amt.in{color:var(--success)}
.activity-amount .amt.out{color:var(--danger)}
.activity-amount .time{font-size:9px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;padding:1px 6px;border-radius:9999px;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-left:4px}
.pill.pending{background:#fef3c7;color:#92400e}
.pill.approved,.pill.completed{background:#d1fae5;color:#065f46}
.pill.rejected,.pill.failed{background:#fee2e2;color:#991b1b}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;margin:auto;max-height:90vh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:24px;padding:24px}}
.modal-title{font-size:17px;font-weight:900;color:var(--brand-dark);margin-bottom:4px;padding-right:28px;line-height:1.3}
@media(min-width:640px){.modal-title{font-size:20px}}
.modal-sub{font-size:11px;color:var(--muted);margin-bottom:16px;line-height:1.4}
@media(min-width:640px){.modal-sub{font-size:12px;margin-bottom:20px}}
.modal-close{position:absolute;top:12px;right:12px;padding:6px;color:var(--muted);border-radius:8px;transition:all .15s}
.modal-close:hover{background:var(--fill);color:var(--brand-dark)}
.modal-close svg{width:18px;height:18px}
.modal-label{font-size:11px;font-weight:700;color:#4b5563;margin-bottom:6px;display:block}
@media(min-width:640px){.modal-label{font-size:12px}}
.modal-input{width:100%;padding:10px;background:var(--fill);border:1px solid var(--border);border-radius:10px;font-size:12px;font-weight:700;color:var(--brand-dark);margin-bottom:12px}
@media(min-width:640px){.modal-input{padding:12px;font-size:14px;border-radius:12px;margin-bottom:14px}}
.modal-input:focus{background:#fff;border-color:var(--brand-primary)}
.modal-confirm{width:100%;padding:12px;background:var(--brand-primary);color:var(--brand-dark);font-weight:800;font-size:13px;border-radius:10px;transition:background .15s;margin-top:4px}
@media(min-width:640px){.modal-confirm{padding:14px;font-size:14px;border-radius:12px;margin-top:6px}}
.modal-confirm:hover{background:var(--brand-hover)}
.modal-confirm:disabled{opacity:.6;cursor:not-allowed}
.modal-info{background:var(--fill);border-radius:10px;padding:10px;margin-bottom:12px;font-size:11px}
@media(min-width:640px){.modal-info{border-radius:12px;padding:12px;margin-bottom:14px;font-size:12px}}
.modal-info-row{display:flex;justify-content:space-between;padding:2px 0;gap:8px}
.modal-info-row span:first-child{color:#6b7280;font-weight:600;flex-shrink:0}
.modal-info-row span:last-child{color:#111827;font-weight:800;font-family:ui-monospace,monospace;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--brand-dark);border-radius:9999px;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}

/* toast */
.toast{position:fixed;bottom:80px;left:16px;right:16px;background:#065f46;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.25);display:none;align-items:center;gap:10px;z-index:300;font-size:12px;font-weight:700}
@media(min-width:768px){.toast{bottom:24px;left:auto;right:24px;max-width:340px;padding:14px 20px;font-size:13px}}
.toast.show{display:flex;animation:slideIn .3s}
.toast.error{background:#991b1b}
.toast svg{width:16px;height:16px;flex-shrink:0}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* mobile nav */
.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.98);backdrop-filter:blur(8px);border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
@media(min-width:768px){.mobile-nav{display:none}}
.mobile-nav-inner{max-width:500px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between}
.mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-radius:12px;transition:all .15s;color:var(--muted);font-weight:500;min-width:0}
.mnav-item.active{color:var(--brand-dark);font-weight:700}
.mnav-item svg{width:20px;height:20px;margin-bottom:2px;transition:transform .15s}
.mnav-item.active svg{transform:scale(1.1);stroke-width:2.4}
.mnav-item .mnav-label{font-size:10px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:767px){.md-only{display:none}}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <button class="menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
      </button>
      <a href="index.html" class="logo-text">KRYPTO<span class="accent">S</span><span class="logo-sub">.exchange</span></a>
    </div>
    <nav class="nav-links md-only">
      <a href="index.html" class="nav-link">Home</a>
      <a href="p2p.html" class="nav-link">P2P</a>
      <a href="trade.html" class="nav-link">Trade</a>
      <a href="swap.html" class="nav-link">Swap</a>
      <a href="wallet.html" class="nav-link active">Wallet</a>
      <a href="careers.html" class="nav-link">Careers <span class="nav-badge">HIRING</span></a>
    </nav>
    <div class="header-actions">
      <div class="balance">
        <span class="balance-val" id="headerBalance">$0.00</span>
        <button class="balance-eye" id="headerEye" title="Hide Balance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button class="avatar" id="headerAvatar" aria-label="Profile">?</button>
      <button class="notif-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
        <span class="notif-badge" id="notifBadge">0</span>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="wallet-wrap">

    <div class="wallet-title-row">
      <h1 class="wallet-title">My assets</h1>

const DEPOSIT_ADDRESSES = {

/* ============ INIT ============ */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.href = 'login.html'; return; }
  currentUser = session.user;
  await setAvatar(currentUser);
  document.getElementById('notifBadge').style.display = 'none';
  await loadBalances();
  renderAssets();
})();

async function setAvatar(user){
  const el = document.getElementById('headerAvatar');
  let initial = '';
  const meta = user.user_metadata || {};
  if(meta.first_name) initial = meta.first_name[0];
  else if(meta.last_name) initial = meta.last_name[0];
  if(!initial){
    const { data: prof } = await sb.from('profiles').select('first_name, last_name').eq('id', user.id).maybeSingle();
    if(prof){
      if(prof.first_name) initial = prof.first_name[0];
      else if(prof.last_name) initial = prof.last_name[0];
    }
  }
  if(!initial && user.email) initial = user.email[0];
  if(!initial) initial = '?';
  el.textContent = initial.toUpperCase();
}

/* ============ BALANCES ============ */
async function loadBalances(){
  const { data, error } = await sb.from('balances').select('coin, amount').eq('user_id', currentUser.id);
  userBalances = {};
  COINS.forEach(c => userBalances[c.sym] = 0);
  if(!error && data){ data.forEach(b => userBalances[b.coin] = Number(b.amount)); }
  updateBalanceDisplay();
}

function totalUSD(){
  let t = 0;
  for(const sym in userBalances) t += userBalances[sym] * (USD_PRICES[sym] || 0);
  return t;
}

function updateBalanceDisplay(){
  const v = '$' + totalUSD().toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.getElementById('balanceDisplay').textContent = balanceHidden ? '****' : v;
  document.getElementById('headerBalance').textContent = balanceHidden ? '****' : v;
}

/* ============ RENDER ============ */
function renderAssets(){
  if(currentView !== 'wallet'){ renderActivity(); return; }
  const list = document.getElementById('assetList');
  const hideZero = document.getElementById('hideZero').checked;
  let items = COINS.map(c => ({...c, amount: userBalances[c.sym] || 0 }));
  if(hideZero) items = items.filter(i => i.amount > 0);

  if(items.length === 0){
    list.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
      No assets with balance. Deposit crypto to get started.
    </div>`;
    return;
  }

  list.innerHTML = items.map(a => {
    const usd = a.amount * (USD_PRICES[a.sym] || 0);
    return `
      <div class="asset-card">
        <div class="asset-left">
          ${a.svg}
          <div>
            <span class="asset-name">${a.name}</span>
            <div class="asset-price">$${(USD_PRICES[a.sym]||0).toLocaleString('en-US', {maximumFractionDigits:2})}</div>
          </div>
        </div>
        <div class="asset-right">
          <div class="asset-balance">${a.amount.toFixed(8).replace(/\.?0+$/,'') || '0'}</div>
          <div class="asset-usd">$${usd.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
          <div class="asset-actions">
            <button class="asset-deposit" onclick="openModal('deposit','${a.sym}')">Deposit</button>
            <button class="asset-withdraw" onclick="openModal('withdraw','${a.sym}')">Withdraw</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function renderActivity(){
  const list = document.getElementById('assetList');
  list.innerHTML = `<div class="empty-state">Loading transactions...</div>`;
  const { data, error } = await sb.from('transactions').select('*').eq('user_id', currentUser.id).order('created_at', {ascending:false}).limit(50);
  if(error || !data || data.length === 0){
    list.innerHTML = `<div class="empty-state">No activity yet. Deposits, withdrawals, and trades will appear here.</div>`;
    return;
  }
  list.innerHTML = `<div class="activity-list">${data.map(tx=>{
    const isIn = ['deposit','swap_in','trade_buy','p2p_buy'].includes(tx.type);
    const arrow = isIn
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>';
    const sign = isIn ? '+' : '-';
    const date = new Date(tx.created_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div class="activity-item">
      <div class="activity-left">
        <div class="activity-icon ${isIn?'in':'out'}">${arrow}</div>
        <div>
          <div class="activity-title">${tx.type.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())} <span class="pill ${tx.status}">${tx.status}</span></div>
          <div class="activity-meta">${tx.coin}</div>
        </div>
      </div>
      <div class="activity-amount">
        <div class="amt ${isIn?'in':'out'}">${sign}${Number(tx.amount).toFixed(8).replace(/\.?0+$/,'')}</div>
        <div class="time">${date}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

/* ============ MODAL ============ */
function openModal(type, symbol){
  const coin = symbol || 'BTC';
  const c = COINS.find(x => x.sym === coin);
  if(!c) return;

  const content = document.getElementById('modalContent');
  if(type === 'deposit'){
    const addr = DEPOSIT_ADDRESSES[coin] || '';
    const network = DEPOSIT_NETWORKS[coin] || '';
    content.innerHTML = `
      <div class="modal-title">Deposit ${c.name}</div>
      <div class="modal-sub">Send ${coin} to the address below, then confirm on this page.</div>
      <div class="modal-info">
        <div class="modal-info-row"><span>Coin</span><span>${coin}</span></div>
        <div class="modal-info-row"><span>Network</span><span>${network}</span></div>
      </div>
      <label class="modal-label">Deposit address (${network})</label>
      <input class="modal-input" readonly value="${addr}" onclick="this.select()" style="font-family:monospace;font-size:11px" />
      <label class="modal-label">Amount you sent (${coin})</label>
      <input class="modal-input" type="number" step="any" id="depAmount" placeholder="0.00" />
      <label class="modal-label">Transaction hash (optional)</label>
      <input class="modal-input" id="depTxHash" placeholder="0x... or transaction ID" style="font-family:monospace;font-size:11px" />
      <button class="modal-confirm" id="depSubmit" onclick="submitDeposit('${coin}')">I've Sent The Crypto</button>
    `;
  } else {
    const bal = userBalances[coin] || 0;
    content.innerHTML = `
      <div class="modal-title">Withdraw ${c.name}</div>
      <div class="modal-sub">Submit a withdrawal request. Admin will review and send after approval.</div>
      <div class="modal-info">
        <div class="modal-info-row"><span>Available</span><span>${bal.toFixed(8).replace(/\.?0+$/,'')} ${coin}</span></div>
      </div>
      <label class="modal-label">Destination address</label>
      <input class="modal-input" id="wdAddr" placeholder="Paste your ${coin} wallet address" style="font-family:monospace;font-size:11px" />
      <label class="modal-label">Amount (${coin})</label>
      <input class="modal-input" type="number" step="any" id="wdAmount" placeholder="0.00" />
      <button class="modal-confirm" id="wdSubmit" onclick="submitWithdraw('${coin}')">Request Withdrawal</button>
    `;
  }
  document.getElementById('modalBackdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
  document.body.style.overflow = '';
}
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if(e.target.id === 'modalBackdrop') closeModal();
});

/* ============ SUBMIT DEPOSIT (silent — no popup) ============ */
async function submitDeposit(coin){
  const amount = parseFloat(document.getElementById('depAmount').value);
  const txHash = document.getElementById('depTxHash').value.trim();
  const btn = document.getElementById('depSubmit');
  if(!amount || amount <= 0){ toast('Enter a valid amount.', true); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting...';
  const { error } = await sb.from('deposit_requests').insert({
    user_id: currentUser.id,
    user_email: currentUser.email,
    coin: coin,
    amount: amount,
    network: DEPOSIT_NETWORKS[coin],
    tx_hash: txHash || null,
    status: 'pending'
  });
  btn.disabled = false;
  btn.textContent = "I've Sent The Crypto";
  if(error){ toast(error.message, true); return; }
  closeModal();
  if(currentView !== 'wallet'){ currentView = 'wallet'; document.querySelectorAll('.asset-tab').forEach((t,i)=>{t.classList.toggle('active', i===0);}); }
  renderAssets();
}

/* ============ SUBMIT WITHDRAW (silent — no popup) ============ */
async function submitWithdraw(coin){
  const addr = document.getElementById('wdAddr').value.trim();
  const amount = parseFloat(document.getElementById('wdAmount').value);
  const btn = document.getElementById('wdSubmit');
  const bal = userBalances[coin] || 0;

  if(!addr || addr.length < 15){ toast('Enter a valid destination address.', true); return; }
  if(!amount || amount <= 0){ toast('Enter a valid amount.', true); return; }
  if(amount > bal){ toast('Insufficient balance. Available: ' + bal + ' ' + coin, true); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting...';
  const { error } = await sb.from('withdraw_requests').insert({
    user_id: currentUser.id,
    user_email: currentUser.email,
    coin: coin,
    amount: amount,
    address: addr,
    network: DEPOSIT_NETWORKS[coin],
    status: 'pending'
  });
  btn.disabled = false;
  btn.textContent = 'Request Withdrawal';
  if(error){ toast(error.message, true); return; }
  closeModal();
}

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await loadBalances();
  renderAssets();
  setTimeout(() => btn.classList.remove('spinning'), 700);
  toast('Wallet refreshed');
});
function toast(msg, isError){
  const t = document.getElementById('toast');
  t.className = 'toast show' + (isError ? ' error' : '');
  document.getElementById('toastMsg').textContent = msg;
  setTimeout(() => t.classList.remove('show'), 3500);
}
setInterval(async () => {
  if(currentUser){
    await loadBalances();
    if(currentView === 'wallet') renderAssets();
  }
}, 30000);
</script>
