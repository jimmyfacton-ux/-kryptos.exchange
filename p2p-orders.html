<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P2P Orders | KRYPTOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand-primary:#FCD535; --brand-hover:#F0B90B; --brand-dark:#181A20;
  --success:#0ECB81; --success-hover:#0BA86C; --danger:#F6465D;
  --muted:#707A8A; --fill:#F5F5F5; --border:#EAECEF; --page:#FAFAFA;
  --font-sans:"Inter","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;border:0 solid;margin:0;padding:0}
html{line-height:1.5;-webkit-text-size-adjust:100%;letter-spacing:-.012em}
body{font-family:var(--font-sans);background:var(--page);color:var(--brand-dark);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--brand-primary);color:var(--brand-dark)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9999px}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select{font-family:inherit;outline:none}
img,svg{display:block;max-width:100%}
select{appearance:none;-webkit-appearance:none;background:transparent;border:none;cursor:pointer}
.container{max-width:1280px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.container{padding:0 24px}}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.flex-col{flex-direction:column}.flex-1{flex:1}.shrink-0{flex-shrink:0}
.text-xs{font-size:12px}.text-sm{font-size:14px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}.font-extrabold{font-weight:800}.font-black{font-weight:900}
.tracking-tight{letter-spacing:-.02em}
.text-muted{color:var(--muted)}
.uppercase{text-transform:uppercase}

/* header */
.site-header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.header-inner{height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(min-width:640px){.header-inner{height:64px}}
.brand{display:flex;align-items:center;gap:4px;flex-shrink:0}
.menu-btn{display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;color:var(--brand-dark);font-weight:600;font-size:14px}
.menu-btn:hover{background:var(--fill)}
.menu-btn svg{width:22px;height:22px;stroke-width:2.4}
.logo-text{font-weight:800;font-size:17px;letter-spacing:-.03em;color:var(--brand-dark);display:flex;align-items:baseline;gap:1px}
@media(min-width:640px){.logo-text{font-size:20px}}
.logo-text .accent{color:var(--brand-hover)}
.logo-sub{font-size:9px;font-weight:700;color:var(--muted);margin-left:1px}
@media(min-width:640px){.logo-sub{font-size:10px}}
.nav-links{display:flex;align-items:center;gap:4px;margin-left:16px}
.nav-link{padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);border-radius:12px;transition:all .15s}
.nav-link:hover{color:var(--brand-dark);background:#f4f4f5}
.nav-link.active{background:var(--brand-dark);color:#fff;font-weight:700}
.nav-badge{margin-left:4px;padding:1px 6px;font-size:9px;font-weight:900;background:var(--success);color:#fff;border-radius:9999px}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.balance{display:flex;align-items:center;gap:4px}
.balance-val{font-size:13px;font-weight:700;color:var(--brand-dark);font-family:ui-monospace,monospace}
@media(min-width:640px){.balance-val{font-size:14px}}
.balance-eye{color:var(--muted);padding:2px}
.balance-eye svg{width:14px;height:14px}
.avatar{width:30px;height:30px;border-radius:9999px;background:linear-gradient(135deg,#FF6700,#E04800);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0;box-shadow:0 0 0 2px rgba(249,115,22,.2)}
@media(min-width:640px){.avatar{width:32px;height:32px}}
.notif-btn{position:relative;padding:6px;color:var(--brand-dark);border-radius:8px;flex-shrink:0}
.notif-btn:hover{background:var(--fill)}
.notif-btn svg{width:18px;height:18px;stroke-width:2.2}
.notif-badge{position:absolute;top:0;right:0;min-width:16px;height:16px;padding:0 4px;background:#dc2626;color:#fff;font-size:9px;font-weight:900;border-radius:9999px;display:none;align-items:center;justify-content:center;border:2px solid #fff}

/* main */
main{padding-top:8px;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
@media(min-width:768px){main{padding-bottom:40px}}
.p2p-wrap{max-width:1280px;margin:0 auto;padding:8px 16px 0}
@media(min-width:768px){.p2p-wrap{padding:8px 24px 0;max-width:1280px}}

/* title */
.title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-top:6px}
.title{font-size:22px;font-weight:900;color:#030712;letter-spacing:-.02em}
@media(min-width:640px){.title{font-size:30px}}
.refresh-btn{padding:7px;color:#6b7280;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:color .15s}
.refresh-btn:hover{color:#111827}
.refresh-btn svg{width:15px;height:15px}
.refresh-btn.spinning svg{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* tabs */
.tab-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab-row::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 14px;border-radius:20px;font-weight:700;font-size:11px;transition:all .15s;background:#fff;color:var(--muted);border:1px solid var(--border);white-space:nowrap;flex-shrink:0}
@media(min-width:640px){.tab-btn{padding:10px 18px;font-size:12px}}
.tab-btn.active{background:var(--brand-dark);color:#fff;border-color:var(--brand-dark)}

/* stats row */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(min-width:640px){.stats-row{grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px}
@media(min-width:640px){.stat-card{border-radius:14px;padding:16px}}
.stat-label{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
@media(min-width:640px){.stat-label{font-size:11px;margin-bottom:6px}}
.stat-val{font-size:20px;font-weight:900;color:#030712}
@media(min-width:640px){.stat-val{font-size:24px}}
.stat-val.warn{color:#ea580c}
.stat-val.ok{color:var(--success)}

/* order list */
.orders-list{display:flex;flex-direction:column;gap:10px}
@media(min-width:640px){.orders-list{gap:12px}}
.order-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;transition:border-color .15s}
@media(min-width:640px){.order-card{border-radius:16px;padding:18px}}
.order-card:hover{border-color:#d1d5db}
.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.order-id{font-size:10px;font-family:ui-monospace,monospace;color:#6b7280;font-weight:700;background:#f9fafb;padding:3px 8px;border-radius:6px;display:inline-block;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:640px){.order-id{font-size:11px;max-width:none}}
.order-status{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;flex-shrink:0}
@media(min-width:640px){.order-status{padding:4px 12px;font-size:11px}}
.order-status.pending{background:#fef3c7;color:#92400e}
.order-status.paid{background:#dbeafe;color:#1e40af}
.order-status.released,.order-status.completed{background:#d1fae5;color:#065f46}
.order-status.cancelled{background:#fee2e2;color:#991b1b}
.order-status.disputed{background:#fed7aa;color:#9a3412}

.order-main{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:640px){.order-main{grid-template-columns:repeat(3,1fr);gap:16px}}
.order-field{min-width:0}
.order-field-label{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
@media(min-width:640px){.order-field-label{font-size:11px}}
.order-field-value{font-size:13px;font-weight:800;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:640px){.order-field-value{font-size:14px}}
.order-field-value.amount{font-family:ui-monospace,monospace}
.order-field-value.green{color:var(--success)}
.order-field-value.red{color:var(--danger)}

.order-actions{display:flex;gap:6px;padding-top:10px;border-top:1px solid #f3f4f6;flex-wrap:wrap}
.order-btn{padding:7px 12px;font-size:11px;font-weight:700;border-radius:8px;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
@media(min-width:640px){.order-btn{padding:8px 16px;font-size:12px;border-radius:10px;gap:6px}}
.order-btn svg{width:12px;height:12px}
@media(min-width:640px){.order-btn svg{width:14px;height:14px}}
.order-btn.cancel{background:#fee2e2;color:#991b1b}
.order-btn.cancel:hover{background:#fecaca}
.order-btn.paid{background:#dbeafe;color:#1e40af}
.order-btn.paid:hover{background:#bfdbfe}
.order-btn.release{background:var(--success);color:#fff}
.order-btn.release:hover{background:var(--success-hover)}
.order-btn.view{background:#f3f4f6;color:#374151}
.order-btn.view:hover{background:#e5e7eb}
.order-btn.dispute{background:#fed7aa;color:#9a3412}
.order-btn.dispute:hover{background:#fdba74}

/* empty / loading */
.empty-state{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;font-weight:500;line-height:1.6}
.empty-state svg{width:40px;height:40px;margin:0 auto 12px;opacity:.4}
.loading{text-align:center;padding:32px;color:#9ca3af;font-size:12px;font-weight:600}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.1);border-top-color:var(--brand-primary);border-radius:9999px;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;margin:auto;max-height:90vh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:24px;padding:24px}}
.modal-title{font-size:17px;font-weight:900;color:var(--brand-dark);margin-bottom:4px;padding-right:28px;line-height:1.3}
@media(min-width:640px){.modal-title{font-size:20px}}
.modal-sub{font-size:11px;color:var(--muted);margin-bottom:16px;line-height:1.4}
@media(min-width:640px){.modal-sub{font-size:12px;margin-bottom:20px}}
.modal-close{position:absolute;top:12px;right:12px;padding:6px;color:var(--muted);border-radius:8px;transition:all .15s}
.modal-close:hover{background:var(--fill);color:var(--brand-dark)}
.modal-close svg{width:18px;height:18px}
.modal-info{background:var(--fill);border-radius:10px;padding:12px;margin-bottom:14px;font-size:12px}
@media(min-width:640px){.modal-info{border-radius:12px;padding:14px;font-size:13px}}
.modal-info-row{display:flex;justify-content:space-between;padding:4px 0;gap:8px}
.modal-info-row span:first-child{color:#6b7280;font-weight:600;flex-shrink:0}
.modal-info-row span:last-child{color:#111827;font-weight:800;font-family:ui-monospace,monospace;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.modal-btn{width:100%;padding:12px;font-size:13px;font-weight:800;border-radius:10px;transition:all .15s;margin-top:8px}
.modal-btn.danger{background:#fee2e2;color:#991b1b}
.modal-btn.danger:hover{background:#fecaca}
.modal-btn.primary{background:var(--brand-primary);color:var(--brand-dark)}
.modal-btn.primary:hover{background:var(--brand-hover)}
.modal-btn:disabled{opacity:.6;cursor:not-allowed}

/* toast */
.toast{position:fixed;bottom:80px;left:16px;right:16px;background:#065f46;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.25);display:none;align-items:center;gap:10px;z-index:300;font-size:12px;font-weight:700}
@media(min-width:768px){.toast{bottom:24px;left:auto;right:24px;max-width:340px;padding:14px 20px;font-size:13px}}
.toast.show{display:flex;animation:slideIn .3s}
.toast.error{background:#991b1b}
.toast svg{width:16px;height:16px;flex-shrink:0}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* mobile nav */
.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.98);backdrop-filter:blur(8px);border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
@media(min-width:768px){.mobile-nav{display:none}}
.mobile-nav-inner{max-width:500px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between}
.mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-radius:12px;transition:all .15s;color:var(--muted);font-weight:500;min-width:0}
.mnav-item.active{color:var(--brand-dark);font-weight:700}
.mnav-item svg{width:20px;height:20px;margin-bottom:2px;transition:transform .15s}
.mnav-item.active svg{transform:scale(1.1);stroke-width:2.4}
.mnav-item .mnav-label{font-size:10px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:767px){.md-only{display:none}}
</style>
</head>

/* ============ SUPABASE ============ */
const SUPABASE_URL = 'https://pzqwmrqdqtozvwfpdmpm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZeJhMI2y2yWGyQ7Aqx_T6A_vyEuVkxJ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const USD_PRICES = { BTC: 81223.18, USDT: 1, ETH: 2358.02, SOL: 102.36, BNB: 612.45 };

let currentUser = null;
let allOrders = [];
let currentFilter = 'all';
let balanceHidden = false;

/* ============ INIT ============ */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.href = 'login.html'; return; }
  currentUser = session.user;
  await setAvatar(currentUser);
  document.getElementById('notifBadge').style.display = 'none';
  await loadHeaderBalance();
  await loadOrders();
})();

async function setAvatar(user){
  const el = document.getElementById('headerAvatar');
  let initial = '';
  const meta = user.user_metadata || {};
  if(meta.first_name) initial = meta.first_name[0];
  else if(meta.last_name) initial = meta.last_name[0];
  if(!initial){
    const { data: prof } = await sb.from('profiles').select('first_name, last_name').eq('id', user.id).maybeSingle();
    if(prof){
      if(prof.first_name) initial = prof.first_name[0];
      else if(prof.last_name) initial = prof.last_name[0];
    }
  }
  if(!initial && user.email) initial = user.email[0];
  if(!initial) initial = '?';
  el.textContent = initial.toUpperCase();
}

async function loadHeaderBalance(){
  const { data } = await sb.from('balances').select('coin, amount').eq('user_id', currentUser.id);
  let total = 0;
  if(data) data.forEach(b => total += Number(b.amount) * (USD_PRICES[b.coin] || 0));
  const v = '$' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.getElementById('headerBalance').textContent = balanceHidden ? '****' : v;
}
document.getElementById('headerEye').addEventListener('click', () => {
  balanceHidden = !balanceHidden;
  loadHeaderBalance();
});

/* ============ LOAD ORDERS ============ */
async function loadOrders(){
  const list = document.getElementById('ordersList');
  list.innerHTML = `<div class="loading"><span class="spinner"></span>Loading your orders...</div>`;

  const { data, error } = await sb.from('p2p_orders')
    .select(`
      *,
      merchants (name, price_kes, payments)
    `)
    .eq('buyer_id', currentUser.id)
    .order('created_at', { ascending: false });

  if(error){
    list.innerHTML = `<div class="empty-state">Error loading orders: ${error.message}</div>`;
    return;
  }

  allOrders = data || [];
  updateStats();
  renderOrders();
}

function updateStats(){
  const pending = allOrders.filter(o => o.status === 'pending').length;
  const escrow = allOrders.filter(o => o.status === 'pending' || o.status === 'paid').length;
  const completed = allOrders.filter(o => o.status === 'released' || o.status === 'completed').length;
  const cancelled = allOrders.filter(o => o.status === 'cancelled').length;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statEscrow').textContent = escrow;
  document.getElementById('statCompleted').textContent = completed;
  document.getElementById('statCancelled').textContent = cancelled;
}

function renderOrders(){
  const list = document.getElementById('ordersList');
  let orders = allOrders;
  if(currentFilter !== 'all'){
    orders = orders.filter(o => o.status === currentFilter);
  }

  if(orders.length === 0){
    list.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      ${currentFilter === 'all' ? 'No P2P orders yet. Browse the marketplace to start trading.' : 'No ' + currentFilter + ' orders.'}
    </div>`;
    return;
  }

  list.innerHTML = orders.map(o => {
    const statusClass = o.status === 'completed' ? 'released' : o.status;
    const date = new Date(o.created_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const merchantName = o.merchants?.name || 'Merchant';
    const orderShortId = o.id.substring(0, 12);

    let actionsHtml = '';
    if(o.status === 'pending'){
      actionsHtml = `
        <button class="order-btn view" onclick="viewOrder('${o.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>View</button>
        <button class="order-btn cancel" onclick="cancelOrder('${o.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Cancel</button>
      `;
    } else if(o.status === 'paid'){
      actionsHtml = `
        <button class="order-btn view" onclick="viewOrder('${o.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>View</button>
        <button class="order-btn dispute" onclick="disputeOrder('${o.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>Dispute</button>
      `;
    } else {
      actionsHtml = `
        <button class="order-btn view" onclick="viewOrder('${o.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>Details</button>
      `;
    }

    return `<div class="order-card">
      <div class="order-head">
        <span class="order-id">#${orderShortId}</span>
        <span class="order-status ${statusClass}">${o.status}</span>
      </div>
      <div class="order-main">
        <div class="order-field">
          <div class="order-field-label">Amount</div>
          <div class="order-field-value amount">${Number(o.amount).toFixed(4)} ${o.coin}</div>
        </div>
        <div class="order-field">
          <div class="order-field-label">Fiat</div>
          <div class="order-field-value">K.Sh ${Number(o.fiat_amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
        <div class="order-field">
          <div class="order-field-label">Merchant</div>
          <div class="order-field-value">${merchantName}</div>
        </div>
        <div class="order-field">
          <div class="order-field-label">Payment</div>
          <div class="order-field-value" style="text-transform:capitalize">${(o.payment_method||'').replace(/_/g,' ')}</div>
        </div>
        <div class="order-field">
          <div class="order-field-label">Date</div>
          <div class="order-field-value" style="font-size:11px;font-family:inherit">${date}</div>
        </div>
        <div class="order-field">
          <div class="order-field-label">Escrow</div>
          <div class="order-field-value ${o.status === 'released' || o.status === 'completed' ? 'green' : (o.status === 'cancelled' ? 'red' : '')}">${o.status === 'released' || o.status === 'completed' ? 'Released' : (o.status === 'cancelled' ? 'Refunded' : 'Locked')}</div>
        </div>
      </div>
      <div class="order-actions">${actionsHtml}</div>
    </div>`;
  }).join('');
}

/* ============ TAB FILTERS ============ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderOrders();
  });
});

/* ============ ACTIONS ============ */
async function cancelOrder(id){
  if(!confirm('Cancel this P2P order? Your funds will be refunded from escrow.')) return;
  const { data, error } = await sb.from('p2p_orders').update({ status: 'cancelled' }).eq('id', id).eq('buyer_id', currentUser.id).select();
  if(error || !data || data.length === 0){ toast('Could not cancel order', true); return; }
  toast('Order cancelled');
  await loadOrders();
}

async function disputeOrder(id){
  if(!confirm('Open a dispute for this order? Admin will review.')) return;
  const { data, error } = await sb.from('p2p_orders').update({ status: 'disputed' }).eq('id', id).eq('buyer_id', currentUser.id).select();
  if(error || !data || data.length === 0){ toast('Could not open dispute', true); return; }
  toast('Dispute opened — admin will review');
  await loadOrders();
}

/* ============ VIEW ORDER MODAL ============ */
function viewOrder(id){
  const o = allOrders.find(x => x.id === id);
  if(!o) return;
  const date = new Date(o.created_at).toLocaleString();
  const merchantName = o.merchants?.name || 'Merchant';
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">Order #${o.id.substring(0,12)}</div>
    <div class="modal-sub">Full order details</div>
    <div class="modal-info">
      <div class="modal-info-row"><span>Status</span><span style="text-transform:uppercase;color:${o.status==='released'||o.status==='completed'?'#0ECB81':(o.status==='cancelled'||o.status==='disputed'?'#F6465D':'#ea580c')}">${o.status}</span></div>
      <div class="modal-info-row"><span>Coin</span><span>${o.coin}</span></div>
      <div class="modal-info-row"><span>Amount</span><span>${Number(o.amount).toFixed(8)} ${o.coin}</span></div>
      <div class="modal-info-row"><span>Fiat amount</span><span>K.Sh ${Number(o.fiat_amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>
      <div class="modal-info-row"><span>Merchant</span><span>${merchantName}</span></div>
      <div class="modal-info-row"><span>Payment</span><span>${(o.payment_method||'').replace(/_/g,' ')}</span></div>
      <div class="modal-info-row"><span>Created</span><span style="font-family:inherit;font-size:11px">${date}</span></div>
    </div>
    <div style="padding:12px;background:${o.status==='pending'?'#fef3c7':(o.status==='released'||o.status==='completed'?'#d1fae5':(o.status==='cancelled'?'#fee2e2':'#fed7aa'))};border-radius:10px;font-size:12px;font-weight:600;color:#111827;line-height:1.5;text-align:center">
      ${o.status==='pending'?'⏳ Waiting for payment confirmation. Escrow locked.':
        o.status==='paid'?'✅ Payment marked. Waiting for merchant to release crypto.':
        o.status==='released'||o.status==='completed'?'✅ Order complete. Crypto released to your wallet.':
        o.status==='cancelled'?'❌ Order cancelled. Funds refunded from escrow.':
        '⚠️ Dispute opened. Admin will review and resolve.'}
    </div>
    <button class="modal-btn primary" onclick="closeModal()">Close</button>
  `;
  document.getElementById('modalBackdrop').classList.add('show');
}

function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
}
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if(e.target.id === 'modalBackdrop') closeModal();
});

/* ============ REFRESH ============ */
document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await loadOrders();
  await loadHeaderBalance();
  setTimeout(() => btn.classList.remove('spinning'), 700);
});

/* ============ TOAST ============ */
function toast(msg, isError){
  const t = document.getElementById('toast');
  t.className = 'toast show' + (isError ? ' error' : '');
  document.getElementById('toastMsg').textContent = msg;
  setTimeout(() => t.classList.remove('show'), 3500);
}

/* auto-refresh every 30s */
setInterval(async () => {
  if(currentUser){
    await loadOrders();
  }
}, 30000);
</script>
</body>
</html>
